# Bygger siden med Hugo og publiserer den til GitHub Pages.
name: Bygg og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.152.2

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - name: Hent arkivet
        uses: actions/checkout@v4
      - name: Installer Hugo
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}" hugo
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"
      - name: Bygg siden
        run: hugo --gc --minify --panicOnWarning
      - name: Last opp ferdig side
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publisering.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: publisering
        uses: actions/deploy-pages@v4

{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ with .Pages }}
<ul class="liste">
{{ range .ByDate.Reverse }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a><br><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time></li>
{{ end }}
</ul>
{{ else }}<p>Ingenting her ennå.</p>{{ end }}
{{ end }}
